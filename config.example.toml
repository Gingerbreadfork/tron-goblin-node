# =============================================================================
# tron-goblin-node — example configuration
# =============================================================================
#
# Usage:
#   tron-node start --config config.toml
#
# Every value below is set to its built-in default, so this file is a safe
# starting point: copy it, then change only what you need. Anything you delete
# falls back to the same default. CLI flags (e.g. --data-dir, --rpc-port,
# --peer) OVERRIDE whatever is set here.
#
# Keys are snake_case; java-tron's camelCase aliases (e.g. `maxOpenFiles`) are
# also accepted so a `config.conf` can be ported across. Unknown keys are
# accepted and ignored.
#
# Security note: every server below binds to 127.0.0.1 by default. Change a
# host to "0.0.0.0" ONLY when you intend to expose that port — the HTTP REST
# and gRPC surfaces include broadcast/writer methods.
# =============================================================================

# On-disk state lives under <data_dir>/db/. Relative paths are resolved from
# the working directory. Overridden by --data-dir.
data_dir = "./tron-data"


# -----------------------------------------------------------------------------
# [storage] — RocksDB tuning + DB lifecycle
# -----------------------------------------------------------------------------
[storage]
# Per-store write-buffer (memtable) size, MiB. Larger = fewer flushes / higher
# write throughput while syncing, at the cost of RAM (this is PER store, and
# there are ~60 stores). 64 suits a mainnet node with a few GB to spare; drop
# to 16–32 on small VMs.
write_buffer_size_mb = 64

# Max open SST file descriptors PER store. Each chainbase store is its own
# RocksDB instance (~60 of them), so the process-wide ceiling is roughly
# this value × 60. 1024 → ~60k aggregate, comfortably under a typical
# RLIMIT_NOFILE; the daemon also raises its own soft FD limit to the hard
# ceiling at startup. Do NOT set this to tens of thousands — multiplied across
# ~60 stores it exhausts the process and sync dies with "Too many open files".
max_open_files = 1024

# Run one full manual compaction across every store at startup. Off by
# default; only useful right after a `prune-before` to reclaim disk now.
compact_on_start = false

# Reorg engine. false = battle-tested BlockUndoStore undo-log path.
# true = java-tron-style SnapshotManager overlay (per-block tentative-write
# layers). The overlay path passes integration tests but hasn't been validated
# under multi-peer concurrency at mainnet scale — leave false unless testing.
snapshot_reorg = false

# Max reorg depth when snapshot_reorg = true: blocks older than this many from
# the head get merged into the root and become un-reorgable. Mainnet rarely
# reorgs past ~10 blocks, so 64 is ample while bounding per-layer RAM.
snapshot_horizon = 64

# --- [storage.db_settings] -------------------------------------------------
# Per-CF RocksDB knobs mirroring java-tron's `storage.dbSettings.*`. Parsed for
# config-file compatibility but NOT yet applied to the open path — changing
# these has no effect today. Listed so a java-tron config.conf round-trips.
[storage.db_settings]
level_number = 7
compact_threads = 0                       # 0 = auto (host CPU count)
blocksize = 16                            # KiB
max_bytes_for_level_base = 256            # MiB
max_bytes_for_level_multiplier = 10.0
level0_file_num_compaction_trigger = 2
target_file_size_base = 64                # MiB
target_file_size_multiplier = 1
max_open_files = 5000                     # java-tron parity only; the EFFECTIVE
                                          # cap is [storage].max_open_files above

# --- [storage.tx_cache] ----------------------------------------------------
# java-tron `storage.txCache.*`. Parsed for parity; not yet wired.
[storage.tx_cache]
estimated_transactions = 1000             # clamped to [100, 10000]
init_optimization = false


# -----------------------------------------------------------------------------
# [p2p] — peer discovery + block sync
# -----------------------------------------------------------------------------
[p2p]
# Explicit peers to sync from, each "HOST:PORT". Empty = rely on discovery
# (and the built-in mainnet seeds). Add your own full node for a fast, stable
# sync source, e.g. peers = ["10.0.0.2:18888"]. Also settable via --peer.
peers = []

# Also mix the built-in MAINNET_SEEDS into the pool. When `peers` is empty the
# seeds are used regardless; this only matters when you also list explicit peers.
use_mainnet_seeds = false

# Kademlia DHT discovery (UDP). On = bootstrap from peers/seeds then widen the
# dial list to the broader network (recommended for public mainnet). Turn OFF
# if you sync only from your own `peers` — it removes a lot of dial churn.
discover_enable = true

# Startup wait for the DHT routing table to populate before snapshotting it.
discover_bootstrap_ms = 5000

# EIP-1459 DNS-discovery trees (walked once at startup). The official mainnet
# tree is enabled by default — without it you'd be limited to the hard-coded
# seeds, which much of the network rejects. Set to [] to disable.
discover_tree_urls = [
  "tree://AKMQMNAJJBL73LXWPXDI4I5ZWWIZ4AWO34DWQ636QOBBXNFXH3LQS@main.trondisco.net",
]
discover_tree_query_timeout_ms = 5000

# Persist the discovered peer set to disk so a restart re-dials known-good
# peers without waiting on bootstrap (java-tron's NodePersistService).
node_discovery_persist = true
node_discovery_persist_interval_ms = 60000

# Port advertised to peers in Hello messages, and (when `listen = true`) the
# port the inbound listener binds. 18889 = mainnet's P2P port 18888 + 1, so a
# java-tron node and this one can run on the same host without clashing. A valid
# non-zero port is required even for outbound-only nodes — java-tron's
# NetUtil.validNode rejects port 0 with BAD_PROTOCOL.
advertise_port = 18889

# Max concurrent peer connections (each = one tokio task + one TCP socket).
# 60 spreads thinly across many ASNs to find archive-capable peers without
# tripping any single host's same-IP cap. Also caps concurrent INBOUND peers.
max_peers = 60

# Accept INBOUND connections so other peers (java-tron deployments and our own
# kind) can sync FROM us. When true, we bind `listen_host:advertise_port` and
# serve the sync protocol (SyncBlockChain -> inventory, FetchInvData -> blocks)
# over accepted connections. A full node should be reachable; set false for a
# pure outbound-only / firewalled sync client. (For external peers to reach you,
# the port must be open through your firewall / NAT.)
listen = true

# Interface the inbound listener binds. "0.0.0.0" = all interfaces; use
# "127.0.0.1" to accept only local connections. Only consulted when listen = true.
listen_host = "0.0.0.0"

# Heartbeat: log an "applied block" line every N blocks. 0 = quiet (failures
# only), 1 = every block, 100 = a usable progress trail during a long sync.
progress_log_interval = 100

# Per-block live-tip fetch timeout, ms (clamped to [100, 1000]).
fetch_block_timeout_ms = 200

# Cooperative-fetch per-peer in-flight block cap (multi-peer fetch only). The
# most blocks this node keeps outstanding to ANY single peer at once. Lower
# spreads the catch-up backlog across more peers (better citizenship, no single
# host overloaded); higher gives each peer a deeper pipeline. Stays at or below
# java-tron's per-connection pull cap (100) so we never out-pressure what a peer
# expects from one connection. Clamped to [16, 100]. Default 64.
sync_fetch_inflight_per_peer = 64

# fastForwardNodes: peers that receive full Block frames directly on production
# (lowest latency) instead of an inventory advertisement. SR/relay operators only.
fast_forward_nodes = []

# Set true to skip the sync loop entirely (RPC-only / archive-serving mode).
disabled = false


# -----------------------------------------------------------------------------
# [rpc] — Ethereum-compatible JSON-RPC (eth_*, net_*)
# -----------------------------------------------------------------------------
[rpc]
host = "127.0.0.1"          # "0.0.0.0" to expose publicly
port = 8546                 # Ethereum-standard 8545 + 1 (java-tron's JSON-RPC also defaults to 8545)
disabled = false
# EIP-155 chain id surfaced via eth_chainId / net_version.
chain_id = 11111
# Per-call gas cap for eth_call / eth_estimateGas. 50M covers heavy read-only
# calls (DEX simulations, multi-hop swaps); lower it for public-facing nodes.
eth_call_gas_cap = 50000000


# -----------------------------------------------------------------------------
# [http] — TronWeb / TronGrid REST API (/wallet/*)
# -----------------------------------------------------------------------------
[http]
host = "127.0.0.1"          # includes broadcasttransaction — open up deliberately
port = 8091                 # java-tron HTTP 8090 + 1, so both coexist on one host
disabled = false


# -----------------------------------------------------------------------------
# [grpc] — Wallet / WalletSolidity gRPC (what TRON client libs speak)
# -----------------------------------------------------------------------------
[grpc]
host = "127.0.0.1"          # includes writer methods — open up deliberately
port = 50052                # java-tron gRPC 50051 + 1
disabled = false


# -----------------------------------------------------------------------------
# [metrics] — Prometheus scrape endpoint
# -----------------------------------------------------------------------------
[metrics]
host = "127.0.0.1"
port = 9091                 # Prometheus default 9090 + 1 (keeps the whole port block one above java-tron)
disabled = false


# -----------------------------------------------------------------------------
# [mempool] — transaction pending-pool sizing (local resource limits, NOT
# consensus). Defaults match java-tron's node.* values.
# -----------------------------------------------------------------------------
[mempool]
max_transaction_pending_size = 2000    # java node.maxTransactionPendingSize; peer relay held below
                                       # this, operator submits reserve headroom above it
pending_transaction_timeout_ms = 60000 # java node.pendingTransactionTimeout; a running sweep ages
                                       # out txs older than this so the pool can't latch at the cap


# -----------------------------------------------------------------------------
# [witness] — Super Representative block production (OPTIONAL)
# -----------------------------------------------------------------------------
# Uncomment to run as a block producer. Without this section the node is
# sync-only. Provide the signing key by exactly ONE method; key_env / keystore
# are preferred over an inline key_hex.
#
# [witness]
# key_env = "TRON_WITNESS_KEY"            # env var holding the raw private key hex
# # key_hex = "0x..."                     # DISCOURAGED: inline private key
# # keystore = "/path/to/keystore.json"   # v3 keystore (java-tron compatible)
# # keystore_password_env = "TRON_KEYSTORE_PASSWORD"
# max_txs_per_block = 1000                # mempool txs pulled per produced block

# -----------------------------------------------------------------------------
# [bundler] — ERC-4337 account-abstraction bundler (OPTIONAL, off by default).
# -----------------------------------------------------------------------------
# When enabled with a signing key, the node serves the bundler RPC namespace
# (eth_sendUserOperation / eth_estimateUserOperationGas / eth_getUserOperation-
# ByHash / eth_getUserOperationReceipt / eth_supportedEntryPoints): it validates
# UserOperations against live state via the constant-call VM, accepts them into
# an in-memory mempool, and batches pending ops into signed handleOps
# transactions submitted with the key below. The debug_bundler_* control
# namespace (sendBundleNow / setBundlingMode / dumpMempool / clearMempool /
# clearState) is also served. Off-protocol — a bundled op is an ordinary
# EntryPoint contract call, so NO consensus effect. Requires an operator-deployed
# EntryPoint (TRON has no canonical one yet); deploy the standard v0.7 EntryPoint
# via CREATE2. The signing account must hold TRX/energy for the handleOps txs.
#
# [bundler]
# enable = true
# entry_points = ["0x0000000071727De22E5E9d8BAf0edAc6f37da032"]  # your EntryPoint
# key_env = "TRON_BUNDLER_KEY"            # signing key (or key_hex / keystore, as [witness])
# # beneficiary = "T..."                  # gas-fee recipient (default: bundler address)
# # fee_limit_sun = 1000000000            # per-bundle TRX fee cap, in sun
# # bundling_mode = "auto"                # auto (submit on interval) | manual (debug_bundler_sendBundleNow)
# # bundle_interval_ms = 2000             # auto-mode bundling cadence
# # max_bundle_size = 50                  # max UserOps packed into one handleOps
# # enforce_validation_rules = true       # reject ops using ERC-7562 banned opcodes during validation


# -----------------------------------------------------------------------------
# [vm] — TVM knobs. Keys accept snake_case and java-tron's camelCase aliases
# (e.g. support_constant / supportConstant). The knobs flagged [wired] are
# honored today; other java-tron vm.* keys parse for config.conf compatibility
# but aren't all consulted yet. Shown at their built-in defaults.
# -----------------------------------------------------------------------------
[vm]
# Enable read-only view calls (triggerConstantContract / eth_call) WITHOUT a
# signature. Default off; turn ON to serve view calls — and REQUIRED on BOTH
# nodes for tron-state-diff's constant-call (TVM-exactness) probing. Expose
# publicly only deliberately.
support_constant = false                  # [wired]

# Energy ceiling a single constant call may consume (java-tron clamps inputs
# up to a 3_000_000 floor).
max_energy_limit_for_constant = 100000000 # [wired]

# Wall-clock cap (ms) on one constant call; 0 = no timeout (opt-in).
constant_call_timeout_ms = 0              # [wired]

# Emit the per-opcode VM trace alongside contract receipts (huge; leave off).
vm_trace = false                          # [wired]

# Persist internal transactions (every CALL / CREATE / SELFDESTRUCT).
save_internal_tx = false                  # [wired]

# Persist "featured" internal txs: system-contract calls (delegate / freeze …).
save_featured_internal_tx = false         # [wired]

# Persist cancelAllUnfreezeV2 per-unfreeze details. Inert unless BOTH
# save_internal_tx and save_featured_internal_tx are also true.
save_cancel_all_unfreeze_v2_details = false

# Enable the eth-style estimateGas RPC.
estimate_energy = false

# Max retry attempts in the estimateGas binary search (java-tron clamps to 0..10).
estimate_energy_max_retry = 3

# Compiled-bytecode LRU cache size.
lru_cache_size = 500

# Long-running-contract rate-limit gate. A contract trips it when its
# CPU-time / mainnet-time ratio exceeds max_time_ratio while it also runs past
# long_running_time (ms); min_time_ratio is the lower "fast enough" bound. Raise
# max_time_ratio on slow hosts so the gate doesn't fire on legitimate calls.
min_time_ratio = 0.0
max_time_ratio = 5.0
long_running_time = 10

# Block-STM optimistic parallel block execution during bulk catch-up,
# byte-identical to the serial path (the serial path is the source of truth; a
# non-converged round commits nothing and falls back to it), so this setting can
# only ever pick the faster of two identical results — it cannot affect state.
#
# WHEN IT HELPS: blocks carrying real VM work. Contract execution dominates the
# fixed parallel overhead (MvMemory init, per-tx versioned stores, rayon
# dispatch), and independent transactions genuinely overlap. This is the modern
# tip era, where it measures ~2-3x over serial.
#
# WHEN IT HURTS: blocks that are mostly plain transfers, i.e. the 2018-2019
# early chain. Per-transaction work is tiny, so the MVCC bookkeeping dominates.
# Measured on blocks 3,334,001-3,342,527: parallel 17.7-18.8ms per block versus
# serial 7.3-8.0ms — 2.3x SLOWER.
#
# WHEN IT MAKES NO DIFFERENCE: whenever durable-write latency exceeds execution
# time. Apply is pipelined, so per-block cost is max(exec, commit-chain). On a
# slow or near-full disk the per-block fsyncs can run ~26ms and hide execution
# entirely — changing this setting then moves nothing. Check which side binds
# before tuning it.
#
# `block_worth_parallel` gates per block on top of this flag. The sync driver
# only engages it while bulk-syncing, never at the tip. Set false to force the
# serial path. Run with BLOCKSTM_DEBUG=1 to log per-block convergence
# (rounds / reexecs / converged).
parallel_exec = true

# Overlap each applied block's commit + undo-log fsync with the next block's
# execution during bulk sync (identical writes in identical order — only the
# overlap changes; flushed at every batch end and before any reorg).
# Auto-disabled in witness mode. Set false to A/B the strictly serial apply.
pipelined_apply = true                    # [wired]


# -----------------------------------------------------------------------------
# [index] — built-in address-history indexer + TronGrid-style /v1 API
# -----------------------------------------------------------------------------
# Turns the node into its own TronGrid-compatible history indexer. With
# `enable = true` and an extracted archive snapshot in the data dir, the node
# detects an empty index over the populated block store and BACKFILLS
# AUTOMATICALLY (no command), prints a progress line with rate, catches up to
# the live head, and follows forever (reorg-reconciling by hash,
# restart-resuming). It then serves address history over the HTTP surface:
#   GET /v1/accounts/{address}/transactions
#   GET /v1/accounts/{address}/transactions/trc20
#   GET /v1/accounts/{address}/transactions/trc721     (tron-goblin extension)
#   GET /v1/accounts/{address}/transactions/internal   (tron-goblin extension)
#   GET /v1/contracts/{address}/events                 (needs scope = "all")
# Same params as TronGrid (limit, fingerprint, only_from/only_to,
# only_confirmed/only_unconfirmed, contract_address, min/max_timestamp,
# order_by) — drop-in for existing TronWeb code, self-hosted, no keys.
#
# Zero external infrastructure: everything lives under <data_dir>/index/,
# which is DISPOSABLE — delete it any time; the node rebuilds it
# automatically (a format-version bump or scope change also rebuilds, with a
# loud log line).
#
# Fast TRC20/internal-tx backfill REQUIRES the snapshot to include a
# transaction-info store (transactionRetStore). Ranges without it index
# native kinds only (counted in tron_node_index_missing_txinfo_blocks_total)
# — historical receipts cannot be regenerated without the historical state
# they executed against. Once the index is enabled, the node persists
# transaction-info for every newly-applied block, so live history is always
# complete.
#
# Disk: a full-history mainnet index at the default scope is terabyte-scale
# — the same order as the archive snapshot itself. Bound it with `scope`,
# `capture_*`, or `backfill.start_height`.
[index]
# Master switch. false (default) = subsystem never starts; no files, no
# threads, one no-op branch per applied block.
enable = false

# Index size/coverage preset. Sets the capture_* flags below; an explicit
# capture_* key overrides the preset.
#   "native"  — TRX/TRC10/account-level only (smallest)
#   "trc20"   — + TRC20/TRC721 transfers + internal txs (default;
#               wallets/explorers)
#   "all"     — + all VM log rows (largest; serves the
#               /v1/contracts/{address}/events search)
scope = "trc20"

# Per-dimension overrides (uncomment to override the scope preset).
# capture_native   = true
# capture_trc20    = true
# capture_trc721   = true   # defaults to the trc20 preset value
# capture_internal = true   # forces vm.save_internal_tx on while indexing
# capture_logs     = false

# Index the CALLED contract of every TriggerSmartContract (not just the
# caller), powering /v1/accounts/{contract}/transactions. Default-off: it is
# the single largest row source (hot contracts accrue billions of rows).
# Changing it later triggers an automatic full index rebuild.
# capture_callee_contract = false

# Opt-in HISTORICAL-STATE ARCHIVE (P2): record every block's committed
# write-set as per-key versions under <data_dir>/archive/db, enabling
# at-height reads via:
#   GET  /v1/archive/account?address=...&block=H
#   GET  /v1/archive/accountresource?address=...&block=H
#   POST /v1/archive/triggerconstantcontract   (standard body + "block": H)
# Each historical point read is ONE seek — no replay, no reconstruction.
# NEVER set by a scope preset: it has its own cost profile (terabyte-scale
# on mainnet; write volume comparable to chain state). Coverage starts when
# first enabled and the archive is NOT rebuildable — deleting it (or
# toggling this off and on) restarts coverage at the then-current head.
# Small crash gaps self-repair exactly from the block-undo log. Requires
# storage.snapshot_reorg = false (the default).
#
# Most operators should NOT set this directly — use the [index.archive]
# section below, whose `enabled = true` implies this flag and adds rolling-
# window retention. Leave this commented to let [index.archive] own it.
# capture_state_deltas = false

# Which stream the index follows.
#   "head"       — canonical head; reorg-reconciled; `only_confirmed` is a
#                  read-time filter (freshest; the default).
#   "solidified" — trail the PBFT-solidified mark; never unwinds; lags ~19
#                  blocks (~1 min).
stream = "head"

[index.backfill]
# "head_first" = newest history queryable within seconds, the long tail
# fills in behind it (default). "floor_first" = one monotonic edge from the
# snapshot base upward.
order = "head_first"
# Blocks per gap-closing window (one atomic write-batch each).
window_blocks = 1024
# Soft cap on transactions per window — bounds batch RAM on heavy ranges.
window_tx_budget = 20000
# Deferred-fsync barrier: WAL-sync once every N windows; crash recovery
# re-derives at most N windows.
fsync_barrier_windows = 16
# Optional capacity clamp: index only from this height up (0 = the snapshot
# base). Changing it later triggers an automatic full index rebuild.
start_height = 0

# -----------------------------------------------------------------------------
# [index.archive] — HISTORICAL-STATE ARCHIVE (operator-facing wrapper)
# -----------------------------------------------------------------------------
# The at-height read surface: "what was account/contract X at block N?" and
# "run a read-only contract call against state as of block N". Capabilities a
# normal TRON node can't provide — there is no enforced state root and no
# public at-height archive. Backed by a versioned-KV store of every block's
# committed write-set (see capture_state_deltas above); each historical point
# read is ONE seek. Served on the HTTP REST port:
#   GET  /v1/archive/account?address=...&block=H
#   GET  /v1/archive/accountresource?address=...&block=H
#   POST /v1/archive/triggerconstantcontract   (standard body + "block": H)
#
# OFF by default — the whole section. STORAGE-HEAVY: size scales with state
# WRITES (changed keys x blocks), roughly ~8-15 GB/day on mainnet, so a 90-day
# rolling window is ~0.8-1.3 TB and full-from-enable reaches tens of TB.
# Coverage starts at the CURRENT HEAD when first enabled (not genesis) and is
# NOT cheaply rebuildable. Full guide: docs/historical-state-archive.md.
[index.archive]
# Master switch. false (default) = no archive. When true, it implies
# [index] capture_state_deltas above (the per-key version capture) and starts
# the indexer if it isn't already running.
enabled = false

# Retention policy.
#   "rolling" — keep a bounded window [head - retain_blocks, head] and prune
#               older versions as the head advances (default; recommended).
#   "full"    — keep every version from the moment capture began; disk grows
#               without bound (only with explicit capacity planning).
mode = "rolling"

# Rolling-mode window depth, in blocks (ignored when mode = "full").
# 2_592_000 ~= 90 days at 3-second blocks. Pruning is IRREVERSIBLE: a height
# that drops below the window base can't be read again. Size for the deepest
# history you intend to query (7d ~ 201_600, 30d ~ 864_000, 1y ~ 10_512_000).
retain_blocks = 2592000

# The FIREHOSE external-sink log (P3): a durable, append-only log of applied
# blocks — decoded transfer facts, TRC20/VM logs, internal txs — with
# explicit UNWIND entries for reorgs and crash recoveries. External
# consumers tail it over gRPC (service tronfirehose.Firehose on the regular
# gRPC port), resuming by sequence number; exactly-once is achieved by
# committing the cursor transactionally with the consumer's own writes.
# Format + cursor protocol + reference consumers (Postgres / NATS
# JetStream / ClickHouse): docs/apis-indexing-firehose.md and the
# crates/tron-firehose-* binaries.
[index.firehose]
enable = false
# Retention budget in MiB; oldest segments are pruned past it. Consumers
# further behind than retention resume at the oldest retained entry.
retain_mb = 32768

# -----------------------------------------------------------------------------
# [index.commitment] — VERIFIABLE STATE-COMMITMENT LAYER
# -----------------------------------------------------------------------------
# A cryptographic commitment over the node's committed state — something TRON
# headers do NOT provide (no enforced state root). When enabled, the node
# maintains a Sparse Merkle Tree (keccak256) over the executor-written state
# surface (the same surface [index.archive] versions; account_asset excluded)
# and exposes, on the HTTP REST port:
#   GET      /v1/commitment/root     — the current state root + committed height
#   GET      /v1/commitment/status   — committed/head heights, lag, bootstrap
#   GET|POST /v1/commitment/proof    — inclusion/exclusion proof for a key
# The root is HISTORY-INDEPENDENT (a pure function of the current key/value
# set), so two independently-bootstrapped nodes at the same committed height
# compute the byte-identical root — an operator can prove the node is
# byte-exact with the canonical chain by comparing roots. Clients can verify
# inclusion/exclusion proofs offline against the root, no trust in the node.
#
# OFF by default — the whole section. NOT consensus-critical: it runs off the
# block-apply hot path, so committed_height trails head by ~confirmation_lag_
# blocks (past finality; committed roots are final, never reorg-able).
# Independent of [index.archive] (neither requires the other). Stores only the
# LATEST tree (~a few % of state size; far smaller than a full archive) under
# <data_dir>/commitment/db. enabled = true implies [index] capture_state_deltas
# above and requires storage.snapshot_reorg = false (the default). NOT cheaply
# rebuildable — toggling off and on re-Merkleizes full state at the then-current
# head. Full guide: docs/verifiable-state-commitment.md.
[index.commitment]
# Master switch. false (default) = no commitment layer. When true, it implies
# [index] capture_state_deltas above (the per-block write-set capture).
enabled = false

# Confirmation depth: the builder folds a block's root into the tree only once
# it is at least this many blocks behind the head it has seen, so committed
# roots are past TRON's ~19-block PBFT finality and never commit reorg-able tip
# state. committed_height therefore trails head by ~this many blocks. Reorgs
# shallower than this are absorbed before the height is ever committed (no tree
# mutation). Lowering it below ~19 risks committing a root a tip reorg later
# orphans; raising it widens the lag. camelCase alias: confirmationLagBlocks.
confirmation_lag_blocks = 20

# Warn threshold: how far the async builder may trail head before logging a
# warning. Tunes the warning only (the work channel is bounded regardless).
# camelCase alias: maxLagBlocks.
max_lag_blocks = 256

# -----------------------------------------------------------------------------
# [rate_limiter] — rate.limiter.* enforcement (java-tron parity).
# Per-component rows gate HTTP servlets (component = path tail OR java's
# servlet class name, e.g. "GetAccountServlet"), the JSON-RPC endpoint
# (component = "jsonrpc" / "JsonRpcServlet"), and gRPC methods
# (component = "protocol.Wallet/GetAccount"). Strategies:
# QpsRateLimiterAdapter (params "qps=N"), IPQPSRateLimiterAdapter
# ("qps=N" per source IP), CIDRQPSRateLimiterAdapter ("qps=N" per source CIDR
# block, "prefix4=24,prefix6=48" default — a whole subnet shares one bucket so
# a flood can't be spread across IPs in one allocation to dodge a per-IP limit;
# prefix4=32,prefix6=128 degrades to exact per-IP), GlobalPreemptibleAdapter
# ("permit=N" concurrent calls). Overruns answer HTTP 429 / gRPC
# RESOURCE_EXHAUSTED.
# -----------------------------------------------------------------------------
[rate_limiter]
# Node-wide ceilings applied after any per-component limit (0 disables).
global_qps = 50000
global_ip_qps = 10000

# Per-endpoint rows (java config.conf shapes accepted):
# [[rate_limiter.http]]
# component = "GetAccountServlet"
# strategy = "IPQPSRateLimiterAdapter"
# params = "qps=10"
#
# [[rate_limiter.rpc]]
# component = "protocol.Wallet/GetAccount"
# strategy = "QpsRateLimiterAdapter"
# params = "qps=100"
#
# [[rate_limiter.http]]                 # per-/24 (and per-/48 v6) limit
# component = "jsonrpc"
# strategy = "CIDRQPSRateLimiterAdapter"
# params = "qps=200,prefix4=24,prefix6=48"

# -----------------------------------------------------------------------------
# [event] — event.subscribe.* plugin loader (java-tron eventplugin parity).
# Compiled-in sinks: kafka. Triggers (block/transaction/contractevent/
# contractlog/solidity) post the same camelCase JSON shapes as java's
# plugin, addresses base58check. Filters (block range / contract address /
# topic) apply to the contract trigger families, like java's matchFilter.
# -----------------------------------------------------------------------------
# [event]
# enable = true
# path = "kafka"                  # plugin id (java zip stems like
#                                 # "plugin-kafka-1.0.0" resolve too)
# server = "127.0.0.1:9092"       # bootstrap servers (comma-separated)
# send_queue_length = 1000        # bounded sink queue (drop-on-full)
# topics = [
#   { trigger_name = "block",         enable = true, topic = "block" },
#   { trigger_name = "transaction",   enable = true, topic = "transaction" },
#   { trigger_name = "contractevent", enable = true, topic = "contractevent" },
#   { trigger_name = "contractlog",   enable = true, topic = "contractlog" },
#   { trigger_name = "solidity",      enable = true, topic = "solidity" },
# ]
# [event.filter]
# from_block = ""
# to_block = ""
# contract_addresses = []
# contract_topics = []

# -----------------------------------------------------------------------------
# [node_backup] — witness HA (java node.backup.*): UDP keepalive election
# between machines sharing one witness key; only the elected MASTER
# produces. Configure the SAME group on every member:
# [node_backup]
# port = 10001
# priority = 8                  # higher wins; ties: higher IP string
# keep_alive_interval = 3000    # ms; timeout = 6× this
# members = ["10.0.0.2", "10.0.0.3"]   # the OTHER machines

# -----------------------------------------------------------------------------
# Schema-only sections (parsed for java-tron config.conf compatibility, but
# their runtimes are not yet wired — setting them is currently a no-op):
#   [committee]    — committee.* governance bootstrap values
#   [local_witness]— top-level localwitness* key sources
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# [sim] — Chronos deterministic time-travel fork simulation (anvil-fork /
# Tenderly for TRON). Fork the chain at an archived block (or head), open a
# never-committed overlay, and run mutating txs/bundles with state/code/
# balance/block overrides -> status, energy, logs, internal-tx trees, opcode
# traces, and state diffs. Exposes tron_simulateBundle, the tron_fork* session
# family, POST /v1/sim/bundle, and upgrades eth_simulateV1 (historical base +
# full stateOverrides + creation calls).
#
# DEFAULT OFF: it executes arbitrary code with large energy budgets and holds
# per-fork memory. Historical forks additionally require [index] archive (they
# read at-height state); leave that off and only latest-base forks work.
# -----------------------------------------------------------------------------
[sim]
enabled = false
# Concurrent named fork sessions before least-recently-used eviction.
max_forks = 8
# Evict a fork session this many seconds after its last use.
fork_ttl_secs = 3600
# Hard cap on a single fork's overlay size (pending overlay keys). Exceeding it
# fails the offending call; the fork itself survives.
max_overlay_keys = 1000000
# Per-request bundle limits.
max_calls_per_bundle = 256
max_blocks_per_bundle = 64
# Per-call energy budget ceiling (defaults to the eth_call gas cap, 50M).
energy_cap = 50000000
# Max slots a `state` (replace-all) override may enumerate before it errors
# (suggesting stateDiff) rather than silently truncating.
max_state_override_slots = 10000
# Per-call trace caps (trace = "full"/"callTree"); bound trace memory when
# running arbitrary bytecode under a big energy budget. A truncated trace is
# flagged (structLogsTruncated / callFramesTruncated). 0 = unlimited.
#   max_struct_logs      — cap on the NUMBER of opcode logs.
#   max_struct_log_bytes — BYTE budget for logs (each clones the ≤32 KiB EVM
#                          stack, so the count cap alone doesn't bound memory).
#   max_call_frames      — cap on retained CALL/CREATE tree frames.
max_struct_logs = 100000
max_struct_log_bytes = 134217728
max_call_frames = 100000
# Per-call wall-clock deadline in ms; 0 disables it (the default). The per-call
# energy budget (energy_cap) is the DETERMINISTIC compute bound. Enabling this
# preempts a runaway call but makes a call that trips it non-deterministic
# across machines (timeout on a slow host, success on a fast one), so it is off
# by default to preserve byte-exact replay.
call_timeout_ms = 0
