[package]
name = "tron-snapshot-convert"
publish.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Standalone tool: convert a java-tron LevelDB snapshot into this node's RocksDB format, deleting each source store as it is converted so peak disk stays near 1x. Keeps the LevelDB dependency out of tron-node."

[dependencies]
# Down-dependency on the storage layer for the RocksDB write path, the
# per-store comparator table, and the shared per-store streaming helper.
tron-chainbase = { path = "../tron-chainbase" }
# Pure-Rust LevelDB reader. java-tron writes its LevelDB stores with the
# native Google LevelDB C++ library (via leveldbjni), i.e. the standard
# on-disk LevelDB format; `rusty-leveldb` is a faithful pure-Rust reader
# of exactly that format and gives explicit comparator-name control for
# the one store (`market_pair_price_to_order`) java writes with a custom
# key comparator. This is the ONLY crate in the workspace that depends on
# it — tron-node stays LevelDB-free.
rusty-leveldb = { version = "4.0.1", default-features = false, features = ["fs"] }
# RocksDB write path + the Zstd codec for the optional `--zstd` output. The
# workspace dep links zstd by default now (so a normal `tron-node` reads
# zstd-compressed snapshots too), so just inherit it rather than re-declaring.
rocksdb = { workspace = true }
thiserror.workspace = true
tar.workspace = true
flate2.workspace = true

[lib]
name = "tron_snapshot_convert"
path = "src/lib.rs"

[[bin]]
name = "tron-snapshot-convert"
path = "src/main.rs"

[dev-dependencies]
# Used by the round-trip tests to synthesize a small multi-store LevelDB
# snapshot (write KVs, including one store with a custom comparator name)
# the way java-tron would lay one out.
rusty-leveldb = { version = "4.0.1", default-features = false, features = ["fs"] }
