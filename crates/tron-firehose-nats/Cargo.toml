[package]
name = "tron-firehose-nats"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Reference firehose consumer: tails a tron-goblin-node's tronfirehose.Firehose gRPC stream and republishes every entry to NATS JetStream (Nats-Msg-Id = seq for server-side dedup). Out-of-process by design — never linked into the node."

# Deliberately NOT a dependency of tron-node / tron-grpc: the node's
# default build carries no sink-side deps. This binary runs its own
# tonic codegen over the same proto/firehose.proto the node serves.

[dependencies]
tonic = { workspace = true }
prost.workspace = true
tokio = { workspace = true }
async-nats = "0.38"
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
tonic-build = { workspace = true }
