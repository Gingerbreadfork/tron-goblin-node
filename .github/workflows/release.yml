name: Release

# Fires when a tag starting with "v" is pushed (e.g. v0.9.0), builds the
# release binary, and publishes it as a GitHub Release for that tag.
on:
  push:
    tags:
      - 'v*'

# The default workflow token is read-only; creating a Release needs write.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish release
    # 22.04 links an older glibc than ubuntu-latest (24.04), so the binary
    # runs on a much wider range of systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler clang libclang-dev llvm-dev

      - name: Build release binary
        run: cargo build --release --bin tron-node

      - name: Package binary
        run: |
          PKG="tron-node-${GITHUB_REF_NAME}-linux-x86_64"
          strip target/release/tron-node
          mkdir -p "dist/${PKG}"
          cp target/release/tron-node README.md LICENSE "dist/${PKG}/"
          tar -C dist -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" | tee "${PKG}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            tron-node-*-linux-x86_64.tar.gz \
            tron-node-*-linux-x86_64.tar.gz.sha256 \
            --title "tron-goblin-node ${GITHUB_REF_NAME}" \
            --generate-notes
