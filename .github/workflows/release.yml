name: Release

# Fires when a tag starting with "v" is pushed (e.g. v0.9.0), builds the
# release binary, and publishes it as a GitHub Release for that tag. Can also
# be dispatched manually with an existing tag to (re)build its bundle — if the
# Release already exists, the assets are attached to it in place.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to build and attach assets to'
        required: true

# The default workflow token is read-only; creating a Release needs write.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # On a tag push the tag is the pushed ref; on a manual dispatch it comes
  # from the input (github.ref_name would be the branch dispatched from).
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    name: Build and publish release
    # 22.04 links an older glibc than ubuntu-latest (24.04), so the binary
    # runs on a much wider range of systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev

      - name: Install protoc
        # ubuntu-22.04's apt protoc (3.12) predates stable proto3-optional
        # support, which the vendored protos rely on; install a current
        # release explicitly so the build does not depend on the runner's
        # system protoc.
        run: |
          PROTOC_VERSION=28.3
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -oq /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
          echo "PROTOC=/usr/local/bin/protoc" >> "$GITHUB_ENV"

      - name: Build and package release bundle
        # Same script contributors run locally, so the bundle's contents and
        # layout are the same recipe either way. The archive is not
        # byte-reproducible (tar records mtimes and ownership, gzip stamps a
        # timestamp), so the published .sha256 attests to this artifact only —
        # a local rebuild will not reproduce the hash.
        run: scripts/build-release.sh "${RELEASE_TAG}"

      - name: Publish GitHub Release
        # If a Release for the tag already exists (created by hand, or a
        # previous run of this job), attach the assets to it instead of
        # failing on the duplicate create.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              dist/tron-node-*-linux-x86_64.tar.gz \
              dist/tron-node-*-linux-x86_64.tar.gz.sha256 \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              dist/tron-node-*-linux-x86_64.tar.gz \
              dist/tron-node-*-linux-x86_64.tar.gz.sha256 \
              --title "tron-goblin-node ${RELEASE_TAG}" \
              --generate-notes
          fi
