name: Release

# Fires when a tag starting with "v" is pushed (e.g. v0.9.0), builds the
# release binary, and publishes it as a GitHub Release for that tag.
on:
  push:
    tags:
      - 'v*'

# The default workflow token is read-only; creating a Release needs write.
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build and publish release
    # 22.04 links an older glibc than ubuntu-latest (24.04), so the binary
    # runs on a much wider range of systems.
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev

      - name: Install protoc
        # ubuntu-22.04's apt protoc (3.12) predates stable proto3-optional
        # support, which the vendored protos rely on; install a current
        # release explicitly so the build does not depend on the runner's
        # system protoc.
        run: |
          PROTOC_VERSION=28.3
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -oq /tmp/protoc.zip -d /usr/local 'bin/protoc' 'include/*'
          sudo chmod +x /usr/local/bin/protoc
          protoc --version
          echo "PROTOC=/usr/local/bin/protoc" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: |
          cargo build --release \
            --bin tron-node --bin tron-wallet --bin tron-replay --bin tron-state-diff \
            --bin tron-firehose-postgres --bin tron-firehose-nats --bin tron-firehose-clickhouse

      - name: Package release bundle
        run: |
          PKG="tron-node-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/${PKG}/scripts" "dist/${PKG}/docs"
          # Binaries (stripped). tron-node sits at the bundle root so the
          # bundled try.sh finds it with no build step.
          for b in tron-node tron-wallet tron-replay tron-state-diff \
                   tron-firehose-postgres tron-firehose-nats tron-firehose-clickhouse; do
            strip "target/release/${b}"
            cp "target/release/${b}" "dist/${PKG}/"
          done
          # Demo launcher, example config, logo, docs, license, readme.
          cp try.sh config.example.toml goblin.svg README.md LICENSE "dist/${PKG}/"
          cp scripts/*.sh "dist/${PKG}/scripts/"
          cp -r docs/. "dist/${PKG}/docs/"
          chmod +x "dist/${PKG}/try.sh" "dist/${PKG}/scripts/"*.sh
          tar -C dist -czf "${PKG}.tar.gz" "${PKG}"
          sha256sum "${PKG}.tar.gz" | tee "${PKG}.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            tron-node-*-linux-x86_64.tar.gz \
            tron-node-*-linux-x86_64.tar.gz.sha256 \
            --title "tron-goblin-node ${GITHUB_REF_NAME}" \
            --generate-notes
